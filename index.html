<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine’s Week (Feb 7 → 14)</title>

  <style> 
    :root{
      --accent:#db2777;
      --card:#ffffffd9;
      --shadow: 0 18px 60px rgba(0,0,0,.18);
      --text:#1f2937;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
      background:
        radial-gradient(900px 600px at 10% 15%, rgba(255, 120, 190, .35), transparent 60%),
        radial-gradient(850px 520px at 90% 25%, rgba(120, 210, 255, .30), transparent 60%),
        radial-gradient(900px 650px at 35% 90%, rgba(255, 230, 130, .30), transparent 60%),
        radial-gradient(900px 650px at 80% 85%, rgba(170, 130, 255, .28), transparent 60%),
        linear-gradient(180deg, #fff1f8, #f6f0ff);
    }

    .wrap{max-width:980px;margin:0 auto;padding:18px 14px 80px;position:relative;z-index:2;}
    .top{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:26px;
      box-shadow:var(--shadow);
      padding:16px;
      backdrop-filter: blur(10px);
    }
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:space-between;}
    .brand{display:flex;gap:12px;align-items:center;}
    .icon{
      width:54px;height:54px;border-radius:16px;
      background: linear-gradient(135deg, #f43f5e, #db2777);
      display:grid;place-items:center;color:#fff;font-size:26px;
      box-shadow: 0 14px 30px rgba(219,39,119,.25);
    }
    h1{margin:0;font-size:22px;line-height:1.2}
    .sub{margin:4px 0 0;opacity:.8;font-weight:700}

    .btns{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    button{
      border:0;
      padding:12px 16px;
      border-radius:999px;
      background:#fff;
      box-shadow:0 10px 24px rgba(0,0,0,.10);
      cursor:pointer;
      font-weight:900;
    }
    button.primary{
      background: var(--accent);
      color:#fff;
      box-shadow:0 12px 28px rgba(219,39,119,.25);
    }

    .grid{
      margin-top:14px;
      display:grid;
      grid-template-columns:repeat(2,1fr);
      gap:12px;
    }
    @media (max-width:720px){ .grid{grid-template-columns:1fr;} }

    .card{
      background:var(--card);
      border:1px solid rgba(255,255,255,.7);
      border-radius:22px;
      box-shadow:var(--shadow);
      padding:16px;
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
    }
    .card h2{margin:0;font-size:22px}
    .date{margin:6px 0 0;opacity:.75;font-weight:800}
    .statusRow{margin-top:14px;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
    .pill{
      display:inline-flex;gap:8px;align-items:center;
      padding:10px 12px;border-radius:999px;
      background:#ffffffc9;border:1px solid rgba(255,255,255,.8);
      font-weight:900;
    }
    .locked{opacity:.65}
    .hint{opacity:.75;font-weight:800}

    /* floating hearts */
    .heart{
      position:fixed;bottom:-40px;z-index:1;pointer-events:none;
      animation: floatUp linear forwards;
      filter: drop-shadow(0 10px 16px rgba(0,0,0,.18));
    }
    @keyframes floatUp{
      from{transform:translateY(0) translateX(0) rotate(0deg);opacity:0}
      10%{opacity:1}
      to{transform:translateY(-110vh) translateX(var(--drift)) rotate(18deg);opacity:0}
    }

    /* MODAL */
    #modal{
      position:fixed;inset:0;z-index:9999;
      display:none;place-items:center;
      background: rgba(0,0,0,.55);
      padding:14px;
    }
    #modal.show{display:grid;}
    .mCard{
      width:min(92vw, 880px);
      border-radius:26px;
      overflow:hidden;
      background:#0b0b0b;
      box-shadow: 0 28px 90px rgba(0,0,0,.55);
      position:relative;
    }
    .mBg{
      height:min(65vh, 560px);
      background:#111;
      background-size:cover;
      background-position:center;
      position:relative;
    }
    .mShade{
      position:absolute;inset:0;
      background: linear-gradient(180deg, rgba(0,0,0,.10), rgba(0,0,0,.78));
    }
    .mTop{
      position:absolute;left:14px;right:14px;top:14px;
      display:flex;gap:10px;align-items:center;justify-content:space-between;
    }
    .mTitle{
      color:#fff;font-weight:1000;font-size:28px;letter-spacing:.2px;
      text-shadow: 0 16px 40px rgba(0,0,0,.55);
    }
    .mBtns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
    .mBtn{
      border:0;border-radius:999px;
      padding:12px 14px;
      font-weight:1000;
      cursor:pointer;
      background: rgba(255,255,255,.92);
    }
    .mBtn.primary{
      background: rgba(219,39,119,.95);
      color:#fff;
    }
    .mBody{
      padding:14px;
      background: linear-gradient(180deg, #0b0b0b, #0b0b0b);
    }
    .mText{
      color:#fff;
      background: rgba(255,255,255,.10);
      border:1px solid rgba(255,255,255,.14);
      border-radius:18px;
      padding:14px;
      font-size:16px;
      line-height:1.55;
      white-space:pre-wrap;
    }
    .small{
      margin-top:10px;
      color:rgba(255,255,255,.85);
      font-weight:800;
      font-size:13px;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="top">
      <div class="row">
        <div class="brand">
          <div class="icon">💘</div>
          <div>
            <h1>Valentine’s Week (Feb 7 → 14)</h1>
            <div class="sub">One surprise each day • locked until its date</div>
          </div>
        </div>

        <div class="btns">
          <button class="primary" id="playAllBtn">Play music 🎶</button>
          <button id="heartsBtn">Hearts ✨</button>
        </div>
      </div>
    </div>

    <div class="grid" id="daysGrid"></div>
  </div>

  <!-- MODAL -->
  <div id="modal" role="dialog" aria-modal="true">
    <div class="mCard">
      <div class="mBg" id="mBg">
        <div class="mShade"></div>
        <div class="mTop">
          <div class="mTitle" id="mTitle">Day</div>
          <div class="mBtns">
            <button class="mBtn" id="mClose">× Close</button>
            <button class="mBtn primary" id="mPlay">Play / Pause 🎶</button>
          </div>
        </div>
      </div>
      <div class="mBody">
        <div class="mText" id="mText"></div>
        <div class="small" id="mSmall"></div>
      </div>
    </div>
  </div>

  <!-- ONE AUDIO PLAYER (we swap src per day) -->
  <audio id="player" loop preload="auto"></audio>

  <script>
    // ✅ Set your year here (for Feb 7–14)
    const YEAR = 2026;

    // ✅ Your EXACT filenames (same folder as index.html)
    const days = [
      { key:"rose",      emoji:"🌹", title:"Rose Day",       month:2, day:7,  img:"07-rose.jpg",      song:"07-rose.mpeg",
        text:`A rose is soft… but its meaning is strong.\nLike us — gentle love, deep bond.\n\nToday’s rose is a small reminder:\n“Even in silence, I choose you.”`},
      { key:"propose",   emoji:"💍", title:"Propose Day",    month:2, day:8,  img:"08-propose.jpg",   song:"08-propose.mpeg",
        text:`Today I say it again — clearly, proudly:\n“I want you. I choose you. Always.”\n\nLet our forever begin again today.`},
      { key:"chocolate", emoji:"🍫", title:"Chocolate Day",  month:2, day:9,  img:"09-chocolate.jpg", song:"09-chocolate.mpeg",
        text:`Sweet days are nice…\nBut even on hard days, I still want you.\n\nYou are my favorite comfort.`},
      { key:"teddy",     emoji:"🧸", title:"Teddy Day",      month:2, day:10, img:"10-teddy.jpg",     song:"10-teddy.mpeg",
        text:`If I could, I’d give you a hug that lasts all day.\n\nUntil then — keep this warmth with you.`},
      { key:"promise",   emoji:"🤝", title:"Promise Day",    month:2, day:11, img:"11-promise.jpg",   song:"11-promise.mpeg",
        text:`I promise:\nTo stand with you.\nTo understand you.\nTo choose you — again and again.\n\nNo matter what.`},
      { key:"hug",       emoji:"🤗", title:"Hug Day",        month:2, day:12, img:"12-hug.jpg",       song:"12-hug.mpeg",
        text:`A hug can say what words cannot.\n\nSo here’s mine:\n“I’m proud of you. I’m with you. I love you.”`},
      { key:"kiss",      emoji:"💋", title:"Kiss Day",       month:2, day:13, img:"13-kiss.jpg",      song:"13-kiss.mpeg",
        text:`A kiss is not just a moment…\nIt’s a promise in silence.\n\nOne heart, one love, one forever.`},
      { key:"valentine", emoji:"❤️", title:"Valentine’s Day",month:2, day:14, img:"14-valentine.jpg", song:"14-valentine.mpeg",
        text:`Happy Valentine’s Day, my love.\n\nIf love had a name, it would be you.\nAnd if forever had a meaning, it would be us.`}
    ];

    const grid = document.getElementById("daysGrid");
    const modal = document.getElementById("modal");
    const mBg = document.getElementById("mBg");
    const mTitle = document.getElementById("mTitle");
    const mText = document.getElementById("mText");
    const mSmall = document.getElementById("mSmall");
    const mClose = document.getElementById("mClose");
    const mPlay = document.getElementById("mPlay");
    const playAllBtn = document.getElementById("playAllBtn");
    const heartsBtn = document.getElementById("heartsBtn");
    const player = document.getElementById("player");

    let currentDay = null;
    let isPlaying = false;

    function startOfDayLocal(year, month, day){
      // month is 1-12
      return new Date(year, month-1, day, 0, 0, 0);
    }
    function isUnlocked(d){
      return new Date() >= startOfDayLocal(YEAR, d.month, d.day);
    }
    function fmtDate(d){
      const dt = startOfDayLocal(YEAR, d.month, d.day);
      return dt.toLocaleDateString(undefined, { month:"short", day:"numeric", year:"numeric" });
    }

    function render(){
      grid.innerHTML = "";
      days.forEach(d=>{
        const unlocked = isUnlocked(d);

        const card = document.createElement("div");
        card.className = "card" + (unlocked ? "" : " locked");

        card.innerHTML = `
          <h2>${d.title} ${d.emoji}</h2>
          <div class="date">${fmtDate(d)}</div>

          <div class="statusRow">
            ${
              unlocked
              ? `<div class="pill">✅ Open</div>
                 <button class="primary" data-open="${d.key}">Tap to view</button>`
              : `<div class="pill">🔒 Locked</div>
                 <div class="hint">Wait for date</div>`
            }
          </div>
        `;

        grid.appendChild(card);
      });

      grid.querySelectorAll("[data-open]").forEach(btn=>{
        btn.addEventListener("click", (e)=>{
          const key = e.currentTarget.getAttribute("data-open");
          openDay(key);
        });
      });
    }

    function setAudio(src){
      // stop first
      player.pause();
      isPlaying = false;
      player.currentTime = 0;

      player.src = src;
      player.load();
    }

    async function playAudio(){
      try{
        await player.play();
        isPlaying = true;
        updatePlayButtons();
      }catch(err){
        // iPhone blocks autoplay unless user gesture
        isPlaying = false;
        updatePlayButtons();
        alert("Tap Play again ❤️ (iPhone allows music only after a tap)");
      }
    }

    function pauseAudio(){
      player.pause();
      isPlaying = false;
      updatePlayButtons();
    }

    function toggleAudio(){
      if(!player.src){
        // if nothing loaded, load today's if opened, else load Rose
        const fallback = currentDay ? currentDay.song : days[0].song;
        setAudio(fallback);
      }
      if(isPlaying) pauseAudio(); else playAudio();
    }

    function updatePlayButtons(){
      mPlay.textContent = isPlaying ? "Pause 🎶" : "Play 🎶";
      playAllBtn.textContent = isPlaying ? "Pause music ⏸️" : "Play music 🎶";
    }

    function openDay(key){
      const d = days.find(x=>x.key===key);
      if(!d) return;

      // extra safety: block if locked
      if(!isUnlocked(d)){
        alert(`Locked ❤️ Opens on ${fmtDate(d)} (12:00 AM)`);
        return;
      }

      currentDay = d;

      // ✅ background image full screen
      mBg.style.backgroundImage = `url("${d.img}")`;

      // ✅ title + text
      mTitle.textContent = `${d.title} ${d.emoji}`;
      mText.textContent = d.text;

      

      // ✅ load that day's song and start (user tapped to open -> allowed)
      setAudio(d.song);
      modal.classList.add("show");
      playAudio();
    }

    function closeModal(){
      modal.classList.remove("show");
      pauseAudio();
      currentDay = null;
    }

    // modal close interactions
    mClose.addEventListener("click", closeModal);
    modal.addEventListener("click", (e)=>{ if(e.target === modal) closeModal(); });

    // play/pause button inside modal
    mPlay.addEventListener("click", toggleAudio);

    // top Play music: plays current if open else plays Rose
    playAllBtn.addEventListener("click", ()=>{
      if(currentDay){
        // if a day is open, ensure correct song is loaded
        if(!player.src.includes(currentDay.song)) setAudio(currentDay.song);
      }else{
        // if nothing open, just play Rose Day music
        if(!player.src || !player.src.includes(days[0].song)) setAudio(days[0].song);
      }
      toggleAudio();
    });

    // hearts
    function spawnHeart(x=null, count=1){
      for(let i=0;i<count;i++){
        const h = document.createElement("div");
        h.className = "heart";
        h.textContent = ["❤","💖","💘","💝","💕","✨"][Math.floor(Math.random()*6)];
        const left = x ?? (Math.random()*100);
        h.style.left = left + "vw";
        h.style.setProperty("--drift", (Math.random()*120 - 60) + "px");
        const dur = 5 + Math.random()*4;
        h.style.animationDuration = dur + "s";
        h.style.fontSize = (18 + Math.random()*18) + "px";
        document.body.appendChild(h);
        setTimeout(()=>h.remove(), dur*1000);
      }
    }
    function burstHearts(n=16){ for(let i=0;i<n;i++) spawnHeart(null,1); }
    heartsBtn.addEventListener("click", ()=>burstHearts(22));
    setInterval(()=>spawnHeart(), 900);
    document.addEventListener("click", (e)=>{
      const vw = (e.clientX / window.innerWidth) * 100;
      spawnHeart(vw, 2);
    });

    // initial
    render();

    // re-check unlock every minute (so it unlocks automatically after midnight)
    setInterval(render, 60*1000);
    updatePlayButtons();

    // Helpful: show errors if image/audio missing
    player.addEventListener("error", ()=>{
      alert("Music file not found. Check filename exactly (case-sensitive) and same folder as index.html.");
    });
  </script>
</body>
</html>
