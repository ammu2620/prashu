<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Valentine’s Week 💗</title>

  <style>
    :root{
      --card: rgba(255,255,255,.78);
      --text:#111827;
      --muted:#6b7280;
      --accent:#db2777;
      --shadow: 0 16px 55px rgba(0,0,0,.14);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      color:var(--text);
      min-height:100vh;
      overflow-x:hidden;
      background:
        radial-gradient(900px 600px at 10% 10%, rgba(255, 120, 190, .30), transparent 60%),
        radial-gradient(900px 650px at 90% 20%, rgba(120, 210, 255, .26), transparent 60%),
        radial-gradient(900px 650px at 50% 95%, rgba(255, 220, 130, .28), transparent 60%),
        linear-gradient(180deg, #fff1f2, #fce7f3);
    }

    /* ====== ENTER OVERLAY (needed for autoplay permission) ====== */
    #enterOverlay{
      position:fixed; inset:0; z-index:9999;
      display:grid; place-items:center;
      background:
        radial-gradient(900px 600px at 10% 15%, rgba(255, 120, 190, .55), transparent 60%),
        radial-gradient(850px 520px at 90% 25%, rgba(120, 210, 255, .55), transparent 60%),
        radial-gradient(900px 650px at 35% 90%, rgba(255, 230, 130, .55), transparent 60%),
        linear-gradient(180deg, #fff1f8, #f6f0ff);
      overflow:hidden;
    }
    #enterOverlay.hidden{display:none}
    .enterCard{
      width:min(560px, 92vw);
      background: rgba(255,255,255,.65);
      border: 1px solid rgba(255,255,255,.75);
      backdrop-filter: blur(12px);
      border-radius: 28px;
      padding: 18px;
      box-shadow: 0 30px 90px rgba(0,0,0,.18);
      text-align:center;
    }
    .enterTitle{
      margin:0;
      font-size:26px;
      font-weight:900;
      color:#db2777;
      text-shadow:0 2px 10px rgba(219,39,119,.20);
    }
    .enterSub{
      margin:10px 0 0;
      color:#374151;
      font-weight:800;
    }
    .enterBtn{
      margin-top:16px;
      display:inline-block;
      padding:14px 22px;
      border-radius:999px;
      border:1px solid rgba(219,39,119,.45);
      background: rgba(255,255,255,.85);
      box-shadow: 0 12px 28px rgba(219,39,119,.18);
      font-weight:900;
      cursor:pointer;
      user-select:none;
    }
    .enterBtn span{ color:#db2777; }

    /* ====== LAYOUT ====== */
    .wrap{max-width:980px;margin:0 auto;padding:22px 16px 72px;}
    .top{
      display:flex; gap:14px; align-items:center; justify-content:space-between; flex-wrap:wrap;
      margin-bottom:14px;
    }
    .brand{
      display:flex; align-items:center; gap:12px;
      background: var(--card);
      border:1px solid rgba(255,255,255,.8);
      border-radius:22px;
      padding:12px 14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }
    .badge{
      width:46px;height:46px;border-radius:16px;
      background: linear-gradient(135deg,#f43f5e,#db2777);
      color:#fff; display:grid; place-items:center;
      box-shadow:0 12px 30px rgba(219,39,119,.25);
      font-size:20px;
    }
    h1{margin:0;font-size:18px}
    .sub{margin:4px 0 0; color:var(--muted); font-size:13px; font-weight:700}

    .hint{
      background: rgba(255,255,255,.60);
      border:1px solid rgba(255,255,255,.75);
      border-radius:18px;
      padding:10px 12px;
      box-shadow:0 10px 25px rgba(0,0,0,.08);
      backdrop-filter: blur(10px);
      font-size:13px;
      color:#374151;
      font-weight:700;
    }

    .grid{
      display:grid;
      grid-template-columns: repeat(4, 1fr);
      gap:12px;
      margin-top:14px;
    }
    @media(max-width:900px){ .grid{grid-template-columns: repeat(2, 1fr);} }

    .dayCard{
      background: var(--card);
      border:1px solid rgba(255,255,255,.85);
      border-radius:24px;
      padding:14px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
      position:relative;
      overflow:hidden;
      cursor:pointer;
      transition: transform .18s ease;
      min-height: 130px;
    }
    .dayCard:hover{ transform: translateY(-2px); }

    .dayTitle{
      font-weight:950;
      font-size:16px;
      margin:0;
      display:flex; align-items:center; gap:8px;
    }
    .dateLine{
      margin:6px 0 0;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
    }
    .status{
      margin-top:10px;
      display:inline-block;
      padding:7px 10px;
      border-radius:999px;
      font-size:12px;
      font-weight:950;
      border:1px solid rgba(255,255,255,.75);
      background: rgba(255,255,255,.72);
    }
    .status.locked{ color:#6b7280; }
    .status.open{ color:#047857; }
    .status.today{ color:#b45309; }

    .countmini{
      margin-top:10px;
      font-size:12px;
      color:#374151;
      font-weight:900;
    }

    /* ====== LOCK OVERLAY + SHAKE ====== */
    .lockOverlay{
      position:absolute; inset:0;
      background: rgba(255,255,255,.62);
      display:grid; place-items:center;
      backdrop-filter: blur(7px);
    }
    .lockBox{
      text-align:center;
      padding:14px 12px;
      border-radius:18px;
      border:1px solid rgba(255,255,255,.80);
      background: rgba(255,255,255,.72);
      box-shadow:0 10px 25px rgba(0,0,0,.12);
      max-width: 240px;
    }
    .lockBox b{display:block;margin-bottom:6px}
    .lockBox small{color:#6b7280;font-weight:800}
    .shake{
      animation: shake .45s ease;
    }
    @keyframes shake{
      0%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      50%{transform:translateX(6px)}
      75%{transform:translateX(-4px)}
      100%{transform:translateX(0)}
    }

    /* ====== MODAL (FULLSCREEN BACKGROUND IMAGE) ====== */
    #modal{
      position:fixed; inset:0;
      display:none;
      z-index:9998;
      background: rgba(0,0,0,.60);
    }
    #modal.show{ display:block; }

    .modalBg{
      position:absolute; inset:0;
      background-size: cover;
      background-position:center;
      filter: saturate(1.05) contrast(1.05);
      transform: scale(1.02);
    }
    .modalShade{
      position:absolute; inset:0;
      background:
        radial-gradient(900px 600px at 20% 20%, rgba(255,255,255,.20), transparent 60%),
        linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.55));
    }

    .modalCard{
      position:relative;
      width:min(900px, 92vw);
      margin: 26px auto;
      border-radius: 28px;
      overflow:hidden;
      box-shadow: 0 30px 90px rgba(0,0,0,.40);
      border:1px solid rgba(255,255,255,.20);
      backdrop-filter: blur(10px);
    }
    .modalTop{
      padding:14px 16px;
      display:flex; align-items:center; justify-content:space-between; gap:10px;
      background: rgba(255,255,255,.14);
      color:#fff;
    }
    .modalTop h2{
      margin:0;
      font-size:16px;
      font-weight:950;
      text-shadow:0 10px 25px rgba(0,0,0,.35);
    }
    .closeBtn{
      border:0;
      background: rgba(255,255,255,.85);
      border-radius:999px;
      padding:10px 12px;
      cursor:pointer;
      font-weight:950;
    }

    .modalBody{
      padding:16px;
      display:grid;
      grid-template-columns: 1fr;
      gap:12px;
      color:#fff;
    }

    .storyBox{
      background: rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.18);
      border-radius:22px;
      padding:14px;
      box-shadow: 0 14px 35px rgba(0,0,0,.18);
      line-height:1.75;
      font-size:14px;
      white-space:pre-wrap;
      text-shadow:0 10px 25px rgba(0,0,0,.25);
    }

    .controls{
      display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:space-between;
      margin-top:6px;
    }
    .pill{
      display:inline-block;
      padding:10px 12px;
      border-radius:999px;
      background: rgba(255,255,255,.85);
      color:#111827;
      border:1px solid rgba(255,255,255,.8);
      font-weight:950;
      font-size:12px;
    }
    .btn{
      border:0;
      padding:10px 14px;
      border-radius:999px;
      background: rgba(255,255,255,.85);
      border:1px solid rgba(255,255,255,.8);
      cursor:pointer;
      font-weight:950;
      box-shadow: 0 10px 25px rgba(0,0,0,.12);
    }
    .btn.primary{
      background: linear-gradient(135deg,#f43f5e,#db2777);
      color:#fff;
      border:0;
    }

    /* Hearts */
    .heart{
      position:fixed;
      bottom:-30px;
      font-size:20px;
      animation: floatUp linear forwards;
      pointer-events:none;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,.20));
      z-index:1;
    }
    @keyframes floatUp{
      from{ transform: translateY(0) translateX(0) rotate(0deg); opacity:0; }
      10%{opacity:1}
      to{ transform: translateY(-110vh) translateX(var(--drift)) rotate(18deg); opacity:0; }
    }
  </style>
</head>

<body>
  <!-- ENTER OVERLAY -->
  <div id="enterOverlay">
    <div class="enterCard">
      <h2 class="enterTitle">Valentine’s Week 💗</h2>
      <div class="enterSub">Tap once to enter (this allows music to play) 🎶</div>
      <div class="enterBtn" id="enterBtn">Tap to <span>enter</span> ✨</div>
      <div style="margin-top:10px; color:#6b7280; font-weight:800; font-size:12px;">
        After entering, each day opens only on its date (7 → 14).
      </div>
    </div>
  </div>

  <div class="wrap">
    <div class="top">
      <div class="brand">
        <div class="badge">💗</div>
        <div>
          <h1>Valentine’s Week Surprise</h1>
          <div class="sub">Days unlock only when the countdown ends ✨</div>
        </div>
      </div>

      <div class="hint">
        <b>Rule:</b> No early access ✅<br/>
        Locked cards will shake if tapped 🔒
      </div>
    </div>

    <div class="grid" id="grid"></div>
  </div>

  <!-- MODAL -->
  <div id="modal" aria-modal="true" role="dialog">
    <div class="modalBg" id="modalBg"></div>
    <div class="modalShade"></div>

    <div class="modalCard">
      <div class="modalTop">
        <h2 id="modalTitle">Day</h2>
        <button class="closeBtn" id="closeBtn">✕</button>
      </div>

      <div class="modalBody">
        <div class="storyBox" id="modalStory"></div>

        <div class="controls">
          <span class="pill" id="musicLabel">Music: Off</span>
          <div style="display:flex; gap:10px; flex-wrap:wrap;">
            <button class="btn" id="musicToggle">Play music 🎶</button>
            <button class="btn primary" id="moreHearts">Hearts ✨</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- ONE AUDIO PLAYER (we swap source per day) -->
  <audio id="player" loop preload="none"></audio>

  <script>
    // ======================
    // IMPORTANT: SET YEAR HERE
    // ======================
    const YEAR = new Date().getFullYear(); // keep current year
    const MONTH = 2; // February (2)

    // Days 7 to 14
    const days = [
      {
        day:7, title:"Rose Day", emoji:"🌹",
        img:"07-rose.jpg", song:"07-rose.mpeg",
        story:
`🌹 Rose Day
Some loves begin softly… like a rose petal.
Today I’m sending you a rose not just as a flower,
but as a feeling — gentle, pure, and only yours. 🤍`
      },
      {
        day:8, title:"Propose Day", emoji:"💍",
        img:"08-propose.jpg", song:"08-propose.mpeg",
        story:
`💍 Propose Day
If life asked me again, “Whom do you choose?”
My heart would answer your name — every time.
Not once. Not sometimes. Always. 💖`
      },
      {
        day:9, title:"Chocolate Day", emoji:"🍫",
        img:"09-chocolate.jpg", song:"09-chocolate.mpeg",
        story:
`🍫 Chocolate Day
You make my life sweeter in the smallest ways.
Even ordinary moments feel like a celebration
when they’re shared with you. 🍫✨`
      },
      {
        day:10, title:"Teddy Day", emoji:"🧸",
        img:"10-teddy.jpg", song:"10-teddy.mpeg",
        story:
`🧸 Teddy Day
A teddy is soft… but you are my safest comfort.
When the world feels heavy, your love feels like home.
Always warm. Always mine. 🤍`
      },
      {
        day:11, title:"Promise Day", emoji:"🤝",
        img:"11-promise.jpg", song:"11-promise.mpeg",
        story:
`🤝 Promise Day
I promise to choose you in every season —
in calm days and chaotic days,
in silence and laughter,
in today and forever. 🤍`
      },
      {
        day:12, title:"Hug Day", emoji:"🤗",
        img:"12-hug.jpg", song:"12-hug.mpeg",
        story:
`🤗 Hug Day
If you could feel my heart right now,
you’d know it’s hugging you tightly —
even from far away. 🤗💗`
      },
      {
        day:13, title:"Kiss Day", emoji:"💋",
        img:"13-kiss.jpg", song:"13-kiss.mpeg",
        story:
`💋 Kiss Day
A kiss is small… but it holds a whole world.
Today, I’m sending you mine —
soft, true, and full of love. 💋`
      },
      {
        day:14, title:"Valentine’s Day", emoji:"❤️",
        img:"14-valentine.jpg", song:"14-valentine.mpeg",
        story:
`❤️ Valentine’s Day
You are my favorite person, my answered prayer, my peace.
If love had a name, it would sound like you.
Happy Valentine’s Day, my love… now and always. ❤️✨`
      }
    ];

    function unlockDate(d){
      return new Date(YEAR, MONTH-1, d, 0,0,0); // local midnight
    }
    function isSameDay(a,b){
      return a.getFullYear()===b.getFullYear() &&
             a.getMonth()===b.getMonth() &&
             a.getDate()===b.getDate();
    }
    function pad2(n){ return String(n).padStart(2,'0'); }

    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalBg = document.getElementById('modalBg');
    const modalTitle = document.getElementById('modalTitle');
    const modalStory = document.getElementById('modalStory');

    const enterOverlay = document.getElementById('enterOverlay');
    const enterBtn = document.getElementById('enterBtn');

    const player = document.getElementById('player');
    const musicToggle = document.getElementById('musicToggle');
    const musicLabel = document.getElementById('musicLabel');
    const closeBtn = document.getElementById('closeBtn');
    const moreHearts = document.getElementById('moreHearts');

    let audioAllowed = false;   // becomes true after first tap (enter)
    let currentDay = null;
    let isPlaying = false;

    // ====== Render cards ======
    function formatDiff(ms){
      if(ms < 0) ms = 0;
      const s = Math.floor(ms/1000);
      const d = Math.floor(s/86400);
      const h = Math.floor((s%86400)/3600);
      const m = Math.floor((s%3600)/60);
      const ss = s%60;
      if(d>0) return `${d}d ${h}h ${m}m ${ss}s`;
      if(h>0) return `${h}h ${m}m ${ss}s`;
      return `${m}m ${ss}s`;
    }

    function render(){
      const now = new Date();
      grid.innerHTML = "";

      days.forEach(item=>{
        const openAt = unlockDate(item.day);
        const openNow = now >= openAt || isSameDay(now, openAt);
        const isToday = isSameDay(now, openAt);

        const card = document.createElement('div');
        card.className = "dayCard";

        const t = document.createElement('div');
        t.className = "dayTitle";
        t.innerHTML = `${item.emoji} ${item.title}`;

        const dateLine = document.createElement('div');
        dateLine.className = "dateLine";
        dateLine.textContent = `${openAt.toDateString()}`;

        const status = document.createElement('div');
        status.className = "status";
        if(isToday){
          status.classList.add("today");
          status.textContent = "Opens today ✨";
        }else if(openNow){
          status.classList.add("open");
          status.textContent = "Open 💖";
        }else{
          status.classList.add("locked");
          status.textContent = "Locked 🔒";
        }

        const cd = document.createElement('div');
        cd.className = "countmini";
        if(openNow){
          cd.textContent = "Unlocked ✅";
        }else{
          cd.textContent = "Unlocks in: " + formatDiff(openAt - now);
        }

        card.appendChild(t);
        card.appendChild(dateLine);
        card.appendChild(status);
        card.appendChild(cd);

        if(!openNow){
          const overlay = document.createElement('div');
          overlay.className = "lockOverlay";
          overlay.innerHTML = `<div class="lockBox">
            <b>Not yet 💗</b>
            <small>Wait until ${openAt.toDateString()}</small>
          </div>`;
          card.appendChild(overlay);
        }

        card.addEventListener('click', ()=>{
          const now2 = new Date();
          const openNow2 = now2 >= openAt || isSameDay(now2, openAt);
          if(!openNow2){
            card.classList.remove("shake");
            void card.offsetWidth; // restart animation
            card.classList.add("shake");
            burstHearts(6);
            return;
          }
          openModal(item);
        });

        grid.appendChild(card);
      });
    }

    // update countdown every second
    setInterval(render, 1000);
    render();

    // ====== Modal open/close ======
    function openModal(item){
      currentDay = item;
      modalTitle.textContent = `${item.emoji} ${item.title} (Feb ${item.day})`;
      modalStory.textContent = item.story;

      // full screen background image
      modalBg.style.backgroundImage = `url('${item.img}')`;

      // swap music for the day
      player.pause();
      isPlaying = false;
      updateMusicUI();

      player.innerHTML = `<source src="${item.song}" type="audio/mpeg">`;
      player.load();

      modal.classList.add("show");
      burstHearts(12);

      // try autoplay ONLY if user already tapped "enter"
      if(audioAllowed){
        tryPlay();
      }
    }

    function closeModal(){
      modal.classList.remove("show");
      player.pause();
      isPlaying = false;
      updateMusicUI();
      currentDay = null;
    }

    closeBtn.addEventListener('click', closeModal);
    modal.addEventListener('click', (e)=>{
      if(e.target === modal) closeModal();
    });

    // ====== Music controls ======
    function updateMusicUI(){
      musicLabel.textContent = isPlaying ? "Music: On 🎶" : "Music: Off";
      musicToggle.textContent = isPlaying ? "Pause music ⏸️" : "Play music 🎶";
    }

    async function tryPlay(){
      try{
        player.volume = 0.7;
        await player.play();
        isPlaying = true;
        updateMusicUI();
      }catch(e){
        // blocked
        isPlaying = false;
        updateMusicUI();
      }
    }

    musicToggle.addEventListener('click', async ()=>{
      audioAllowed = true; // user clicked
      if(!isPlaying){
        await tryPlay();
      }else{
        player.pause();
        isPlaying = false;
        updateMusicUI();
      }
    });

    // ====== Enter overlay (first tap enables autoplay attempts) ======
    enterBtn.addEventListener('click', async ()=>{
      audioAllowed = true;

      // "prime" the audio system with a tiny play attempt (works on iPhone)
      try{
        player.volume = 0.001;
        await player.play();
        player.pause();
        player.volume = 0.7;
      }catch(e){}

      enterOverlay.classList.add('hidden');
      burstHearts(14);
    });

    // ====== Hearts ======
    function spawnHeart(){
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = ['❤','💖','💘','💝','💕'][Math.floor(Math.random()*5)];
      h.style.left = (Math.random()*100) + 'vw';
      h.style.setProperty('--drift', (Math.random()*120 - 60) + 'px');
      const dur = 5 + Math.random()*4;
      h.style.animationDuration = dur + 's';
      h.style.fontSize = (18 + Math.random()*16) + 'px';
      document.body.appendChild(h);
      setTimeout(()=>h.remove(), dur*1000);
    }
    function burstHearts(n=14){ for(let i=0;i<n;i++) spawnHeart(); }
    setInterval(()=>spawnHeart(), 900);
    moreHearts.addEventListener('click', ()=>burstHearts(18));
  </script>
</body>
</html>
